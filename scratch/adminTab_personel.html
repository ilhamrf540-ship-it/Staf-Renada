<div id="adminTab_personel" style="display: none;">
          <!-- Management Personnel Database Block -->
          <div class="dashboard-card">
          <h3>Manajemen Database Personil</h3>
          
          <!-- Add / Edit Personel Form -->
          <form id="personnelForm" onsubmit="savePersonnel(event)" style="background: #f8fafc; border: 1.5px solid var(--border-color); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
            <input type="hidden" id="editPersId" value="">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersUsername">Username <span class="required">*</span></label>
                <input type="text" id="editPersUsername" placeholder="Username untuk login" required>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersPassword">Kata Sandi / Password <span class="required">*</span></label>
                <input type="text" id="editPersPassword" placeholder="Kata sandi akun" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersNama">Nama Lengkap <span class="required">*</span></label>
                <input type="text" id="editPersNama" placeholder="Nama lengkap personel" required>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersNrp">NRP <span class="required">*</span></label>
                <input type="text" id="editPersNrp" placeholder="Nomor NRP" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersPangkat">Pangkat <span class="required">*</span></label>
                <select id="editPersPangkat" required>
                  <option value="" disabled selected>Pilih Pangkat</option>
                  <option value="Letda">Letda (Letnan Dua)</option>
                  <option value="Lettu">Lettu (Letnan Satu)</option>
                  <option value="Kapten">Kapten</option>
                  <option value="Mayor">Mayor</option>
                  <option value="Letkol">Letkol (Letnan Kolonel)</option>
                  <option value="Kolonel">Kolonel</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label for="editPersCorps">Corps <span class="required">*</span></label>
                <select id="editPersCorps" required>
                  <option value="" disabled selected>Pilih Corps</option>
                  <option value="Infanteri (Inf)">Infanteri (Inf)</option>
                  <option value="Armed (Arm)">Armed (Arm)</option>
                  <option value="Arhanud (Arh)">Arhanud (Arh)</option>
                  <option value="Kavaleri (Kav)">Kavaleri (Kav)</option>
                  <option value="Zeni (Czi)">Zeni (Czi)</option>
                  <option value="Penerbangan (Cpn)">Penerbangan (Cpn)</option>
                  <option value="Komunikasi dan Elektronika (Cke)">Komunikasi dan Elektronika (Cke)</option>
                  <option value="Peralatan (Cpl)">Peralatan (Cpl)</option>
                  <option value="Pembekalan Angkutan (Cba)">Pembekalan Angkutan (Cba)</option>
                  <option value="Kesehatan Militer (Ckm)">Kesehatan Militer (Ckm)</option>
                  <option value="Polisi Militer (Cpm)">Polisi Militer (Cpm)</option>
                  <option value="Ajudan Jenderal (Caj)">Ajudan Jenderal (Caj)</option>
                  <option value="Topografi (Ctp)">Topografi (Ctp)</option>
                  <option value="Keuangan (Cku)">Keuangan (Cku)</option>
                  <option value="Hukum (Chk)">Hukum (Chk)</option>
                </select>
              </div>
            </div>

            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
              <button type="submit" class="btn btn-accent" id="submitPersBtn">
                <span id="submitPersBtnText">Tambah Personel Baru</span>
              </button>
              <button type="button" class="btn btn-secondary" id="btnCancelEditPers" onclick="cancelEditPersonnel()" style="display: none;">
                Batal
              </button>
            </div>
          </form>

          <!-- List of Personnel -->
          <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem; font-family: 'Outfit', sans-serif;">Daftar Akun Personel Terdaftar:</h4>
          
          <!-- Import/Export buttons -->
          <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
            <input type="file" id="importPersonnelFile" accept=".csv, .txt" onchange="importPersonnel(this)" style="display: none;">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('importPersonnelFile').click()" style="font-size: 0.8rem; padding: 0.4rem 0.85rem;">
              📥 Import Personel (.csv / .txt)
            </button>
            <button type="button" class="btn btn-secondary" onclick="exportPersonnelToWord()" style="font-size: 0.8rem; padding: 0.4rem 0.85rem;">
              📝 Export ke Word (.doc)
            </button>
            <button type="button" class="btn btn-secondary" onclick="exportPersonnelToExcel()" style="font-size: 0.8rem; padding: 0.4rem 0.85rem;">
              📊 Export ke Excel (.xls)
            </button>
          </div>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.25rem; margin-top: -0.75rem;">
            * Format berkas import (.txt/.csv): <code>username | password | nama | nrp | pangkat | corps</code> (Satu akun per baris).
          </p>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Kata Sandi</th>
                  <th>Nama Lengkap</th>
                  <th>NRP</th>
                  <th>Pangkat</th>
                  <th>Corps</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="adminPersonnelTableBody">
                <!-- Personnel rows rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
        </div> <!-- End adminTab_personel -->
